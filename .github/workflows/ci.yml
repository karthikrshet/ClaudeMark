name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Test Suite
        run: python -m pytest -q tests/

      - name: Compile package
        run: python -m compileall -q claudemark

      - name: Run reproducible benchmark
        run: python claudemark.py benchmark --json

      - name: Smoke Test CLI Commands
        run: |
          python claudemark.py version
          python claudemark.py capabilities
          python claudemark.py analyze --text "Sample test prompt for automated CI testing."
          python claudemark.py experimental

      - name: Audit Dependencies (pip-audit)
        if: matrix.os == 'ubuntu-latest'
        run: python -m pip_audit -r requirements-dev.txt
