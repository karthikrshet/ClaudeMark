name: claudemark

services:
  claudemark:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/karthikrshet/claudemark:latest
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      - HOST=0.0.0.0
      - PORT=8765
    read_only: true
    tmpfs:
      - /tmp:size=512M
    restart: unless-stopped
